<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Карта рейсов · ФАРВАТЕР</title>
<link rel="stylesheet" href="./leaflet.css"><link rel="stylesheet" href="./map.css">
<script defer src="./leaflet.js"></script><script defer src="./overview.js"></script><script defer src="./map.js"></script>
</head>
<body>
<div id="toolbar" role="group" aria-label="Вид маршрутов">
  <div class="modes" id="modes"><button id="geo">География</button><button id="scheme">Схема</button></div>
  <button id="pick-centre" hidden>Поставить точку в центре</button>
  <button id="retry" hidden>Обновить карту</button>
  <button id="fit" title="Показать все видимые точки">Весь маршрут</button>
</div>
<div id="canvas" role="region" aria-label="Интерактивная карта маршрутов"></div>
<div id="caption" role="status"></div>
</body></html>
