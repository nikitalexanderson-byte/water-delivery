name: Release WaySlate
run-name: Release WaySlate to ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Среда выпуска'
        type: choice
        options: [staging, production]
        default: staging
      build_only:
        description: 'Собрать подписанный APK для выбранной среды без выкладки'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: farvater-release-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: staging
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    outputs:
      site_url: ${{ steps.origin.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select the release HTTPS origin
        id: origin
        env:
          TARGET: ${{ inputs.target }}
          STAGING_SITE_URL: ${{ vars.STAGING_SITE_URL }}
          PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
        run: |
          case "$TARGET" in
            staging) site=$STAGING_SITE_URL ;;
            production) site=$PRODUCTION_SITE_URL ;;
            *) exit 1 ;;
          esac
          [[ "$site" =~ ^https://([a-zA-Z0-9.-]+|\[[0-9a-fA-F:]+\])(:[0-9]+)?/?$ ]] || {
            echo "::error::The selected environment requires an HTTPS origin without a path or credentials"
            exit 1
          }
          site=${site%/}
          echo "ANDROID_API_URL=$site" >> "$GITHUB_ENV"
          echo "site_url=$site" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.1.0"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble release APK
        working-directory: apps/android
        run: bash gradlew :app:testDebugUnitTest :app:assembleRelease
      - name: Align, sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.STAGING_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.STAGING_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/apk-sign.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$work/signing.keystore"
          unset KEYSTORE_BASE64
          sdk="$ANDROID_HOME/build-tools/36.1.0"
          apk="$RUNNER_TEMP/wayslate.apk"
          install -d "$work/assets"
          printf '{"version_code":%s}\n' "$ANDROID_VERSION_CODE" > "$work/assets/farvater-release.json"
          cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk "$work/unsigned.apk"
          (cd "$work" && zip -q -0 unsigned.apk assets/farvater-release.json)
          "$sdk/zipalign" -f -P 16 4 "$work/unsigned.apk" "$work/aligned.apk"
          "$sdk/apksigner" sign --ks "$work/signing.keystore" --ks-key-alias farvater-staging \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$apk" "$work/aligned.apk"
          "$sdk/zipalign" -c -P 16 4 "$apk"
          "$sdk/apksigner" verify --verbose --print-certs "$apk"
          python3 apps/android/tools/verify_direct.py \
            --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" \
            --apk "$apk" --version-code "$ANDROID_VERSION_CODE"
      - uses: actions/upload-artifact@v4
        with:
          name: wayslate-${{ inputs.target }}-${{ github.run_number }}
          path: ${{ runner.temp }}/wayslate.apk
          if-no-files-found: error

  deploy:
    if: ${{ !inputs.build_only && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    env:
      ANDROID_API_URL: ${{ needs.build.outputs.site_url }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wayslate-${{ inputs.target }}-${{ github.run_number }}
          path: ${{ runner.temp }}
      - name: Send release to the selected VPS
        env:
          TARGET: ${{ inputs.target }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ vars.PRODUCTION_SSH_KNOWN_HOSTS }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          case "$TARGET" in
            staging)
              DEPLOY_HOST=$STAGING_HOST
              SSH_KNOWN_HOSTS=$STAGING_SSH_KNOWN_HOSTS
              SSH_PRIVATE_KEY=$STAGING_SSH_PRIVATE_KEY
              ;;
            production)
              DEPLOY_HOST=$PRODUCTION_HOST
              SSH_KNOWN_HOSTS=$PRODUCTION_SSH_KNOWN_HOSTS
              SSH_PRIVATE_KEY=$PRODUCTION_SSH_PRIVATE_KEY
              ;;
            *) exit 1 ;;
          esac
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          work=$(mktemp -d "$RUNNER_TEMP/wayslate-ssh.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$work/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$work/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS STAGING_SSH_PRIVATE_KEY PRODUCTION_SSH_PRIVATE_KEY
          ssh-keygen -F "$DEPLOY_HOST" -f "$work/known_hosts" > /dev/null
          ssh -T -i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$work/known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            "farvater-deploy@$DEPLOY_HOST" "$GITHUB_SHA" < "$RUNNER_TEMP/wayslate.apk"
      - name: Verify public health and APK
        run: |
          set -euo pipefail
          site=${ANDROID_API_URL%/}
          fetch=(curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 120 --retry 3 --retry-all-errors)
          # The first deployment can take time to obtain a public TLS certificate.
          curl --fail --silent --show-error --proto '=https' --connect-timeout 8 --max-time 12 \
            --retry 20 --retry-delay 5 --retry-all-errors --retry-max-time 150 \
            "$site/health/ready" | jq -e '.ok == true' > /dev/null
          "${fetch[@]}" "$site/downloads/wayslate.apk" -D "$RUNNER_TEMP/apk-headers" -o "$RUNNER_TEMP/served.apk"
          grep -iF 'content-disposition: attachment; filename=wayslate.apk' "$RUNNER_TEMP/apk-headers"
          cmp "$RUNNER_TEMP/wayslate.apk" "$RUNNER_TEMP/served.apk"
          checksum=$(sha256sum "$RUNNER_TEMP/served.apk" | cut -d' ' -f1)
          bytes=$(wc -c < "$RUNNER_TEMP/served.apk")
          "${fetch[@]}" "$site/api/app-release" |
            jq -e --argjson version "$ANDROID_VERSION_CODE" --argjson bytes "$bytes" --arg hash "$checksum" \
              '.version_code==$version and .size_bytes==$bytes and .sha256==$hash' > /dev/null
