name: Release staging

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Собрать подписанный APK без выкладки на VPS'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: farvater-staging-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: staging
    env:
      ANDROID_API_URL: ${{ vars.STAGING_SITE_URL }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate staging HTTPS origin
        run: |
          [[ "$ANDROID_API_URL" =~ ^https://([a-zA-Z0-9.-]+|\[[0-9a-fA-F:]+\])(:[0-9]+)?/?$ ]] || {
            echo "::error::STAGING_SITE_URL must be an HTTPS origin without a path or credentials"
            exit 1
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.1.0"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble release APK
        working-directory: apps/android
        run: bash gradlew testReleaseUnitTest assembleRelease
      - name: Align, sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.STAGING_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.STAGING_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/apk-sign.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$work/signing.keystore"
          unset KEYSTORE_BASE64
          sdk="$ANDROID_HOME/build-tools/36.1.0"
          apk="$RUNNER_TEMP/farvater-driver.apk"
          "$sdk/zipalign" -f -P 16 4 apps/android/app/build/outputs/apk/release/app-release-unsigned.apk "$work/aligned.apk"
          "$sdk/apksigner" sign --ks "$work/signing.keystore" --ks-key-alias farvater-staging \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$apk" "$work/aligned.apk"
          "$sdk/zipalign" -c -P 16 4 "$apk"
          "$sdk/apksigner" verify --verbose --print-certs "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: farvater-driver-staging-${{ github.run_number }}
          path: ${{ runner.temp }}/farvater-driver.apk
          if-no-files-found: error
      - name: Send release to staging
        if: ${{ !inputs.build_only }}
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$STAGING_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          work=$(mktemp -d "$RUNNER_TEMP/staging-ssh.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$work/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$work/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          ssh-keygen -F "$STAGING_HOST" -f "$work/known_hosts" > /dev/null
          ssh -T -i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$work/known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            "farvater-deploy@$STAGING_HOST" "$GITHUB_SHA" < "$RUNNER_TEMP/farvater-driver.apk"
      - name: Verify public health and APK
        if: ${{ !inputs.build_only }}
        run: |
          set -euo pipefail
          site=${ANDROID_API_URL%/}
          fetch=(curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 120 --retry 3 --retry-all-errors)
          "${fetch[@]}" "$site/health/ready" | jq -e '.ok == true' > /dev/null
          "${fetch[@]}" "$site/downloads/farvater-driver.apk" -o "$RUNNER_TEMP/served.apk"
          cmp "$RUNNER_TEMP/farvater-driver.apk" "$RUNNER_TEMP/served.apk"
