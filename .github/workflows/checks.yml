name: API and web
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: farvater_ci
          POSTGRES_USER: farvater_ci
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://farvater_ci:ci-local-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/farvater_ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
