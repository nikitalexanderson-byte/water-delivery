name: API and web
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: farvater_ci
          POSTGRES_USER: farvater_ci
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://farvater_ci:ci-local-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/farvater_ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Verify the web panel and seeded PostgreSQL accounts
        run: |
          node --env-file=.env --input-type=module <<'JS'
          const base='http://127.0.0.1:'+process.env.API_PORT;
          const web=await fetch(base);
          if(!web.ok || !(await web.text()).includes('<title>WaySlate · Доставка воды</title>')) throw Error('web panel');
          const map=await fetch(base+'/route-map/index.html');
          if(!map.ok || !(await map.text()).includes('id="canvas"')) throw Error('map shell');
          const example=await (await fetch(base+'/route-map/example.json')).json();
          if(example.flatMap(trip=>trip.stops).length!==9) throw Error('map assets');
          const login=await fetch(base+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({email:'dispatcher@farvater.test',password:process.env.DEMO_PASSWORD})});
          if(!login.ok) throw Error('login '+login.status);
          const {token}=await login.json();
          const response=await fetch(base+'/api/resources',{headers:{Authorization:'Bearer '+token}});
          if(!response.ok || (await response.json()).vehicles.length!==2) throw Error('fleet');
          JS
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
  vps:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      COMPOSE_BAKE: "false"
      SITE_ADDRESS: http://localhost
      VPS_BIND: 127.0.0.1
      VPS_HTTP_PORT: 19080
      VPS_HTTPS_PORT: 19443
      POSTGRES_DB: farvater_vps_ci
      POSTGRES_USER: farvater_vps_ci
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.vps.example .env.vps
      - name: Add an APK download fixture
        run: |
          install -d downloads
          printf 'farvater-download-fixture\n' > downloads/farvater-driver.apk
      - name: Match the deployment checkout permissions
        run: |
          chmod -R go-rwx apps packages
          chmod go-rwx package*.json deploy/Caddyfile
      - run: docker compose --env-file .env.vps -f deploy/compose.vps.yml config --quiet
      - run: docker compose --env-file .env.vps -f deploy/compose.vps.yml up --build --wait --wait-timeout 150
      - name: Verify the proxy and restore a fresh backup in a separate database
        shell: bash
        run: |
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS http://localhost:19080/health/ready
          curl -fsS http://localhost:19080/route-map/example.json > /dev/null
          curl -fsSI http://localhost:19080/downloads/wayslate.apk | grep -iF 'content-type: application/vnd.android.package-archive'
          curl -fsSI http://localhost:19080/downloads/wayslate.apk | grep -iF 'content-disposition: attachment; filename=wayslate.apk'
          curl -fsS http://localhost:19080/downloads/wayslate.apk | cmp - downloads/farvater-driver.apk
          curl -fsS http://localhost:19080/downloads/farvater-driver.apk | cmp - downloads/farvater-driver.apk
          dump=$(bash deploy/backup.sh "$RUNNER_TEMP/farvater-backup")
          compose=(docker compose --env-file .env.vps -f deploy/compose.vps.yml)
          "${compose[@]}" exec -T db createdb -U "$POSTGRES_USER" farvater_restore
          "${compose[@]}" exec -T db pg_restore --exit-on-error -U "$POSTGRES_USER" -d farvater_restore < "$dump"
          "${compose[@]}" exec -T db psql -U "$POSTGRES_USER" -d farvater_restore -Atc 'SELECT count(*) FROM teams' | grep -Fx 1
          "${compose[@]}" exec -T db psql -U "$POSTGRES_USER" -d farvater_restore -Atc 'SELECT count(*) FROM accounts' | grep -Fx 0
      - if: failure()
        run: docker compose --env-file .env.vps -f deploy/compose.vps.yml logs
      - if: always()
        run: docker compose --env-file .env.vps -f deploy/compose.vps.yml down
